name: Post-Deployment Smoke Tests

# Run smoke tests after deployment to verify critical functionality
# Requirements: 33.9

on:
  # Run after successful deployments
  deployment_status:
  
  # Allow manual triggers with environment URL
  workflow_dispatch:
    inputs:
      environment_url:
        description: 'Environment URL to test'
        required: true
        default: 'https://findam.com'

jobs:
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    
    # Only run if deployment succeeded
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Determine environment URL
        id: get-url
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "url=${{ github.event.inputs.environment_url }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ github.event.deployment_status.environment_url }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for ${{ steps.get-url.outputs.url }} to be ready..."
          for i in {1..30}; do
            if curl -f -s "${{ steps.get-url.outputs.url }}/api/health" > /dev/null 2>&1; then
              echo "✅ Environment is ready!"
              exit 0
            fi
            echo "⏳ Waiting... (attempt $i/30)"
            sleep 10
          done
          echo "❌ Environment failed to become ready"
          exit 1
      
      - name: Run smoke tests
        env:
          BASE_URL: ${{ steps.get-url.outputs.url }}
        run: npm run test:smoke
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      
      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 Smoke tests failed for ${{ steps.get-url.outputs.url }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Smoke Test Failure*\n\nEnvironment: ${{ steps.get-url.outputs.url }}\nWorkflow: ${{ github.workflow }}\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        continue-on-error: true
      
      - name: Comment on PR
        if: failure() && github.event.deployment_status.environment == 'preview'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## 🚨 Smoke Tests Failed
            
            The smoke tests failed for this deployment.
            
            **Environment:** ${{ steps.get-url.outputs.url }}
            **Workflow Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Please review the test results and fix any issues before merging.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
        continue-on-error: true
